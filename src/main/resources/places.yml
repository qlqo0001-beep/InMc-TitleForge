# ============================================================
#  장소 이름 — 월드와 생물군계를 보여줄 이름
# ============================================================
#  /칭호 관리 → 장소 이름 에서 GUI 로 고치는 것을 권장합니다.
#
#  PlaceholderAPI
#    %titleforge_world%       월드 이름 (색은 § 코드로 — TAB·채팅 플러그인용)
#    %titleforge_world_mini%  월드 이름 (MiniMessage 원문)
#    %titleforge_world_id%    월드의 실제 이름
#    %titleforge_biome%       생물군계 이름 (§ 코드)
#    %titleforge_biome_mini%  생물군계 이름 (MiniMessage 원문)
#    %titleforge_biome_id%    생물군계 id (예: terralith:arid_highlands)
#
#  이름이 없으면 월드는 실제 이름, 생물군계는 id 가 그대로 보입니다.
#  값은 MiniMessage 입니다(<gradient:#색:#색>글자</gradient>, <bold> 등).
#
#  플러그인이 업데이트되어 기본 이름이 늘면 켤 때(/it reload 포함) 이 파일에 자동으로 더해집니다.
#  지운 이름은 '' 로 남아 다시 생기지 않습니다 — 되살리려면 그 줄을 지우세요.
#
#  worlds   월드 폴더 이름. 대소문자를 가리지 않습니다.
#  biomes   네임스페이스를 뗀 이름(arid_highlands)이면 어느 데이터팩의 것이든 맞습니다.
#           같은 이름이 두 데이터팩에 있어 따로 부르고 싶으면 전체 id(terralith:arid_highlands)로 적습니다.
#           전체 id 가 먼저입니다.
# ============================================================

