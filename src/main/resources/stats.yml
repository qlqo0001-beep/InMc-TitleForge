# ══════════════════════════════════════════════════════════════
#  스텟 정의
#
#  ▸ 바닐라 스텟 28종은 플러그인에 내장되어 있습니다.
#    (공격력 · 공격속도 · 공격넉백 · 휩쓸기피해 · 최대체력 · 방어력 · 방어강도 ·
#     넉백저항 · 흡수체력 · 폭발넉백저항 · 낙하피해배율 · 화상지속 · 이동속도 ·
#     점프력 · 안전낙하거리 · 중력 · 계단높이 · 웅크리기속도 · 지형이동효율 ·
#     수중이동효율 · 크기 · 채굴속도 · 채굴효율 · 수중채굴속도 · 블록도달거리 ·
#     개체도달거리 · 산소보너스 · 행운)
#    이 파일이 비어 있어도, MMOItems 가 없어도 **항상 그대로 동작**합니다.
#    같은 id 로 적으면 설명·아이콘·권장 범위만 덮어쓸 수 있습니다.
#
#  ▸ 아래는 MythicLib(MMOItems) 가 제공하는 스텟 전체입니다.
#    MMOItems 의 SharedStat 목록을 그대로 옮겼으며, 바닐라 Attribute 로 이미 처리되는
#    항목은 위 내장 목록에 있으므로 중복 적용을 피하기 위해 여기서 제외했습니다.
#    MythicLib 이 없으면 값은 보관되고 API·플레이스홀더로만 노출되며,
#    GUI 에는 "미연동" 으로 표시됩니다. 쓰지 않는 스텟은 통째로 지워도 됩니다.
#
#  필드
#    kind         : vanilla | mmo | virtual   (virtual = 값만 보관)
#    category     : combat | defense | mobility | resource | world | utility
#    display      : GUI 에 보일 이름
#    description  : 설명 로어 (여러 줄 가능)
#    icon         : GUI 아이콘 Material
#    attribute    : kind=vanilla 일 때 바닐라 Attribute 키
#    mmo-stat     : kind=mmo 일 때 MMOItems 스텟 ID
#    operation    : ADD_NUMBER | ADD_SCALAR | MULTIPLY_SCALAR_1  (바닐라 전용)
#    display-scale: 표시 배율. 내부 0.1 을 10%% 로 보이려면 100
#    suffix       : 표시 단위 문자열 (예: %%)
#    decimals     : 소수점 자리수
#    base         : 플레이어 기본값 안내용
#    soft-min/max : 권장 입력 범위 (표시 단위). 벗어나면 경고만 하고 적용은 됩니다.
#    order        : 클수록 앞에 배치
# ══════════════════════════════════════════════════════════════

