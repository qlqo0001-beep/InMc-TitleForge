# ══════════════════════════════════════════════════════════════
#  스텟 정의
#
#  ▸ 바닐라 스텟 9종(최대 체력 · 공격력 · 공격 속도 · 방어력 · 방어 강도 ·
#    넉백 저항 · 흡수 체력 · 이동 속도 · 행운)은 플러그인에 내장되어 있습니다.
#    이 파일이 비어 있어도, MMOItems 가 없어도 **항상 그대로 동작**합니다.
#    아래처럼 같은 id 로 적으면 설명·아이콘·권장 범위만 덮어쓸 수 있습니다.
#
#  ▸ 아래 MMOItems 스텟은 MythicLib(MMOItems) 가 설치된 경우에만 실제로 적용됩니다.
#    없으면 값은 보관되고 API·플레이스홀더로만 노출되며, GUI 에는 "미연동" 으로 표시됩니다.
#    쓰지 않는 스텟은 통째로 지워도 됩니다.
#
#  필드
#    kind         : vanilla | mmo | virtual   (virtual = 값만 보관)
#    category     : combat | defense | mobility | utility
#    display      : GUI 에 보일 이름
#    description  : 설명 로어 (여러 줄 가능)
#    icon         : GUI 아이콘 Material
#    attribute    : kind=vanilla 일 때 바닐라 Attribute 키
#    mmo-stat     : kind=mmo 일 때 MMOItems 스텟 ID
#    operation    : ADD_NUMBER | ADD_SCALAR | MULTIPLY_SCALAR_1  (바닐라 전용)
#    display-scale: 표시 배율. 내부 0.1 을 10% 로 보이려면 100
#    suffix       : 표시 단위 문자열 (예: %)
#    decimals     : 소수점 자리수
#    base         : 플레이어 기본값 안내용
#    soft-min/max : 권장 입력 범위 (표시 단위). 벗어나면 경고만 하고 적용은 됩니다.
#    order        : 클수록 앞에 배치
# ══════════════════════════════════════════════════════════════

# ── MMOItems 전투 스텟 ──────────────────────────────────────────
critical_strike_chance:
  kind: mmo
  mmo-stat: CRITICAL_STRIKE_CHANCE
  category: combat
  display: '치명타 확률'
  description:
    - '공격이 치명타로 터질 확률입니다.'
    - '치명타는 추가 피해를 줍니다.'
  icon: QUARTZ
  suffix: '%'
  soft-min: -100.0
  soft-max: 100.0
  order: 80

critical_strike_power:
  kind: mmo
  mmo-stat: CRITICAL_STRIKE_POWER
  category: combat
  display: '치명타 피해'
