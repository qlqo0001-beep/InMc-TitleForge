# 스텟 편집
stat:
  prompt-chat: '<yellow><side></yellow> <gray>- <white><stat></white> <gray>값을 채팅에 입력하세요.<newline><dark_gray>  현재: <white><current></white> <dark_gray>| 권장 범위: <gray><range><newline><dark_gray>  <gold>표시 단위<dark_gray>로 입력합니다. <gray>제거<dark_gray>=0 또는 "제거", 그만두려면 <gray>취소<newline><dark_gray>  입력한 문장은 채팅에 남지 않습니다.'
  applied: '<green><side></green> <white><stat></white> <green>을(를) <white><value></white> <green>(으)로 설정했습니다.'
  removed: '<yellow><side></yellow> <white><stat></white> <yellow>을(를) 제거했습니다.'
  reset-all: '<yellow><name></yellow> <yellow>의 모든 스텟을 초기화했습니다.'
  nothing-to-remove: '<yellow>해당 <side>에 설정된 값이 없습니다.'
  invalid: '<red>숫자로 해석할 수 없습니다: <gray><value></gray> <dark_gray>(예: 2, 2.5, -1.5)'
  too-large: '<red>값이 너무 큽니다. <gray>(최대 <limit>)'
  out-of-range: '<gold>경고: <white><stat></white> <gold>값이 권장 범위(<range>)를 벗어났습니다. 그대로 적용했습니다.'

