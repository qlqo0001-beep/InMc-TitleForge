# ══════════════════════════════════════════════════════════════
#  InMc-TitleForge
#  칭호(Title) · 인장(Seal) · 닉네임(Nickname)
#  모든 문자열은 MiniMessage 형식입니다. (https://docs.advntr.dev/minimessage)
# ══════════════════════════════════════════════════════════════

storage:
  # SQLITE 또는 MYSQL
  type: SQLITE
  sqlite:
    file: data.db
  mysql:
    host: localhost
    port: 3306
    database: titleforge
    username: root
    password: ''
    # MariaDB 드라이버를 사용하며 MySQL 서버에도 그대로 연결됩니다.
    # 한글 ID/닉네임을 위해 utf8mb4 를 권장합니다.
    # 테이블도 utf8mb4 로 만들어 주세요: ALTER DATABASE titleforge CHARACTER SET utf8mb4;
    properties: 'useUnicode=true&characterEncoding=utf8mb4'
    pool-size: 6
  # 변경된 프로필을 몇 초마다 일괄 저장할지 (0 = 자동 저장 끔)
  autosave-seconds: 300
  # 퇴장 후 캐시를 몇 초간 유지할지 (재접속이 잦은 서버는 높게)
  cache-keep-seconds: 60

title:
  # 표시 칭호 미장착 시 플레이스홀더가 돌려줄 값
  none-display: ''
  # 능력치 칭호 미장착 시
  none-stat: '<gray>없음</gray>'
  # 보유 개수 마일스톤 보너스. "개수: {스텟: 수치}"
  collection-milestones:
    10:
      max_health: 2.0
    25:
      max_health: 4.0
      attack_damage: 0.5
    50:
      max_health: 6.0
      attack_damage: 1.0
      armor: 1.0

seal:
  none-display: ''

nickname:
  # 닉네임 기능 자체 사용 여부
  enabled: true
  # 입력 방식: ANVIL(모루 팝업) 또는 CHAT(채팅 입력)
  input-mode: ANVIL
  # 길이 계산: CHARS(글자 수) 또는 WIDTH(한글을 2로 계산)
  length-mode: CHARS
  min-length: 2
  max-length: 12
  # 허용 문자 구성
  allow-korean: true
  allow-english: true
  allow-digits: true
  allow-space: false
  # 위 옵션 외에 추가로 허용할 문자들 (정규식 문자클래스 안에 그대로 들어갑니다)
  extra-allowed-chars: '_-'
  # 완성형 한글만 허용 (자음/모음 단독 입력 차단)
  korean-complete-only: true
  # 같은 닉네임 중복 금지
  unique: true
  # 포함되면 거부되는 단어 (대소문자 무시)
  blacklist:
    - admin
    - 관리자
    - 운영자
    - staff
  # 변경 제한
  cooldown-seconds: 604800   # 7일. 0이면 쿨타임 없음
  cost:
    economy:
      # Vault 가 설치되어 있을 때만 동작합니다.
      enabled: false
      amount: 10000.0
    item:
      enabled: false
      material: PAPER
      amount: 1
      # 아이템 이름이 일치해야 소모됩니다. 비우면 이름 검사 없음 (MiniMessage)
      name: '<light_purple>닉네임 변경권</light_purple>'

display:
  # 이름 조합 포맷. <seal> <title> <nickname> 사용 가능
  nameplate-format: '<seal><title><nickname>'
  # 각 요소가 있을 때만 붙는 접미 공백 처리용
  seal-suffix: ' '
  title-suffix: ' '
  # displayName(각종 시스템 메시지에 쓰이는 표시 이름) 적용
  display-name: true
  # 탭 리스트 이름 적용 (기본 꺼짐 — TAB 등 전용 플러그인과 충돌 방지)
  tab: false
  # 채팅 포맷 직접 처리 (기본 꺼짐 — 채팅 플러그인과 충돌 방지)
  chat:
    enabled: false
    format: '<nameplate><dark_gray> » </dark_gray><white><message></white>'
  # 표시 갱신 티커 주기(틱). 이름표·탭리스트가 모두 꺼져 있으면 태스크를 만들지 않습니다.
  refresh-ticks: 20

  # ── 머리 위 이름표 (여러 줄 지원, 기본 꺼짐) ──
  # TextDisplay 1개에 줄바꿈으로 렌더링하므로 줄이 늘어도 엔티티는 1개입니다.
  nametag:
    enabled: false
    # 위에서부터 한 줄씩. 치환 결과가 비면 그 줄은 자동으로 빠집니다.
    # <seal> <title> <nickname> <player> 와 다른 플러그인의 %플레이스홀더% 사용 가능
    lines:
      - '<seal>'
      - '%vault_prefix%'      # 예시: 다른 플러그인 칭호
      - '<title><nickname>'
    # 머리 위 높이 (블록)
    height-offset: 0.4
    # 보이는 거리
    view-range: 32.0
    # 벽 너머로도 보이게 할지
    see-through: false
    text-shadow: true
    background: false
    # ARGB 정수. background: true 일 때만 사용
    background-color: 1073741824
    # 본인에게도 보일지. 자기 인장을 확인할 수 있어야 하므로 기본 true
    show-to-self: true
    # 바닐라 이름표(아이디)를 숨길지
    hide-vanilla: true

  # ── 탭리스트 머리말/꼬리말 (기본 꺼짐) ──
  tablist:
    enabled: false
    # 내장 토큰: <tps> <mspt> <online> <max> <ping> <time> <date> <world> <player>
    #            <nickname> <seal> <title>
    # 다른 플러그인의 %플레이스홀더% 도 사용 가능합니다.
    header:
      - '<gradient:#8be9fd:#bd93f9><bold>InMc 서버</bold></gradient>'
      - '<gray>접속 <white><online><gray>/<white><max>  <dark_gray>|  <gray>TPS <tps>'
    footer:
      - '<gray><date> <white><time>'
      - '<gray>지연 <white><ping>ms  <dark_gray>|  <gray>MSPT <mspt>'
    # TPS/MSPT 색상 임계값
    tps-good: 19.0
    tps-warn: 15.0
    mspt-good: 25.0
    mspt-warn: 45.0

gui:
  # 목록 GUI 한 페이지에 표시할 칸 수 (9의 배수, 최대 45)
  page-size: 45
  # 미보유 항목도 목록에 노출할지 (기본값. GUI 안에서 토글 가능)
  show-unowned-by-default: true
  # 스텟 값을 채팅으로 입력할 때 대기 시간(초). 0 이면 무제한.
  # 입력한 문장은 취소 처리되어 채팅·콘솔 어디에도 기록되지 않습니다.
  chat-input-timeout-seconds: 60
  filler: GRAY_STAINED_GLASS_PANE
  icons:
    title: NAME_TAG
    seal: HEART_OF_THE_SEA
    profile: PLAYER_HEAD
    admin: COMMAND_BLOCK
    owned: PAPER
    locked: GRAY_DYE
    equipped: ENCHANTED_BOOK

# 칭호·인장 수집 개수 순위
rank:
  enabled: true
  # 집계 결과 캐시 시간(초). 짧을수록 최신이지만 쿼리가 잦아집니다.
  cache-seconds: 300
  # 순위 GUI 에 표시할 인원 수 (최대 45)
  top-size: 45

# 콘솔 디버그 로그
debug: false
